<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون موسیقی ایرانی</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="quiz-container">
        <h1>آزمون موسیقی ایرانی</h1>
        <div id="player-area">
            <div id="score">امتیاز: 0</div>
            
            <audio id="audio-player" controls>
                Your browser does not support the audio element.
            </audio>
            
            <div id="interaction-area">
                <div id="feedback"></div>
                <button id="next-btn">بعدی ▶</button>
            </div>
        </div>

        <div id="options-container">
            <!-- Buttons will be generated by JS -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
